# L6 Send rules: what happens to the agent's reply, per ticket type.
#   send   = goes to the customer alone
#   draft  = waits for a person to read it and send it
# Every type starts at draft. Switch a type to send only after it passes its tests (L7).

refund: draft
billing: draft
access: send
upsell: draft
question: draft
other: draft

# Always a person, whatever the type says. The code checks this, not the agent:
#   the agent called hand_off_to_person, or the sender is not verified.

# A short fixed reply when a ticket goes to a person. Written by code, not by the AI. send or off
holding_reply: send

# Checks before a reply goes out alone. A reply that fails a check stays a draft.
never_in_replies:
  - INTERNAL
  - internal note
  - customer id
must_name_a_source: yes
allowed_link_domains:
  - kitebridge.example
